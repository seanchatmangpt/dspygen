name: DSPyGen Architecture Crown

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.chatmangpt/**'
      - '.specify/**'
      - 'ggen.toml'
      - 'src/dspygen/architecture/**'
      - 'src/dspygen/subcommands/architecture_cmd.py'
      - 'docs/architecture/**'
      - 'receipts/**'
      - 'scripts/verify_architecture.py'
      - 'tests/architecture/**'
      - '.github/workflows/architecture-crown.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dspygen-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-verifier:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate SHA
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Execute positive witnesses and negative falsifiers
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests/architecture -v

      - name: Replay receipt with independent verifier
        env:
          PYTHONPATH: src
        run: python3 scripts/verify_architecture.py

      - name: Prove no generated directory exists
        run: test ! -d generated

      - name: Prove generated surfaces identify their source law
        run: |
          grep -n 'Auto-generated by ggen' src/dspygen/architecture/catalog.py
          grep -n 'Auto-generated by ggen' docs/architecture/CATALOG.md
          grep -n 'DO NOT EDIT' src/dspygen/architecture/catalog.py
          grep -n 'DO NOT EDIT' docs/architecture/CATALOG.md

      - name: Prove lifecycle and standing are orthogonal
        run: |
          grep -n 'class LifecycleState' src/dspygen/architecture/model.py
          grep -n 'class Standing' src/dspygen/architecture/model.py
          ! sed -n '/class Standing/,/class ArchitectureRefusal/p' src/dspygen/architecture/model.py | grep -q RETIRED

      - name: Prove the deterministic kernel has no direct actuation imports
        run: |
          ! grep -nE 'subprocess|socket|requests|urllib|os\.system' src/dspygen/architecture/model.py
          grep -n 'REQUIRED_BROKER = "BRCE"' src/dspygen/architecture/model.py

  ggen-contract-admission:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate SHA
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Checkout exact ggen source contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: seanchatmangpt/ggen
          ref: 68952593c40214ac1a681073d65f3902a9cdfce4
          path: .tools/ggen

      - name: Admit current ggen command and package identities
        run: |
          grep -n '^name = "ggen-cli-lib"$' .tools/ggen/crates/ggen-cli/Cargo.toml
          grep -n '^name = "ggen"$' .tools/ggen/crates/ggen-cli/Cargo.toml
          grep -n 'ggen sync run' .tools/ggen/.claude/skills/sync-executor.md

      - name: Validate manifest and projection closure
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          root = Path('.')
          manifest = tomllib.loads((root / 'ggen.toml').read_text())
          assert manifest['project']['name'] == 'dspygen'
          ontology = root / manifest['ontology']['source']
          assert ontology.is_file(), ontology
          rules = manifest['generation']['rules']
          assert len(rules) == 2
          assert len({rule['name'] for rule in rules}) == len(rules)
          for rule in rules:
              query = root / rule['query']['file']
              template = root / rule['template']['file']
              output = root / rule['output_file']
              assert query.is_file(), query
              assert template.is_file(), template
              assert output.is_file(), output
              assert 'ORDER BY' in query.read_text(), query
              assert not rule['output_file'].startswith('generated/')
              assert rule['mode'] == 'Overwrite'
          print('GGEN_CONTRACT_ADMITTED rules=2 ordered_queries=2 canonical_outputs=2')
          PY

      - name: Classify exact compiler execution boundary
        run: |
          grep -n 'hard absolute-path deps on sibling' .tools/ggen/crates/ggen-cli/Cargo.toml
          echo 'GGEN_COMPILER_EXECUTION standing=UNSUPPORTED reason=exact-revision-has-machine-local-sibling-dependencies'
