name: Ngrok Credential Hygiene

on:
  pull_request:
    paths:
      - "ngrok.yml"
      - "**/*ngrok*.yml"
      - "**/*ngrok*.yaml"
      - "scripts/verify_ngrok_credentials.py"
      - "tests/security/test_ngrok_credential_hygiene.py"
      - ".github/workflows/ngrok-credential-hygiene.yml"
  push:
    branches: [main]
    paths:
      - "ngrok.yml"
      - "**/*ngrok*.yml"
      - "**/*ngrok*.yaml"
      - "scripts/verify_ngrok_credentials.py"
      - "tests/security/test_ngrok_credential_hygiene.py"
      - ".github/workflows/ngrok-credential-hygiene.yml"

permissions:
  contents: read

jobs:
  credential-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$expected"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tracked ngrok configs with deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_ngrok_credentials.py > /tmp/ngrok-hygiene-1.json
          python scripts/verify_ngrok_credentials.py > /tmp/ngrok-hygiene-2.json
          cmp /tmp/ngrok-hygiene-1.json /tmp/ngrok-hygiene-2.json
          cat /tmp/ngrok-hygiene-1.json
      - name: Run credential regression falsifiers
        run: python -m unittest tests.security.test_ngrok_credential_hygiene -v
      - name: Prove clean replay subject
        run: test -z "$(git status --porcelain)"
