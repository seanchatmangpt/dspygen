name: Ngrok Credential Hygiene

on:
  pull_request:
    paths:
      - "ngrok.yml"
      - "**/*ngrok*.yml"
      - "**/*ngrok*.yaml"
      - "scripts/verify_ngrok_credentials.py"
      - "tests/security/test_ngrok_credential_hygiene.py"
      - ".github/workflows/ngrok-credential-hygiene.yml"
  push:
    branches: [main]
    paths:
      - "ngrok.yml"
      - "**/*ngrok*.yml"
      - "**/*ngrok*.yaml"
      - "scripts/verify_ngrok_credentials.py"
      - "tests/security/test_ngrok_credential_hygiene.py"
      - ".github/workflows/ngrok-credential-hygiene.yml"

permissions:
  contents: read

jobs:
  credential-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tracked ngrok configs
        run: python scripts/verify_ngrok_credentials.py
      - name: Run credential regression falsifiers
        run: python -m unittest tests.security.test_ngrok_credential_hygiene -v
