name: Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: dspygen-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    name: uv dependency receipt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve newest compatible dependency graph
        run: uv lock --upgrade
      - name: Validate lock against project metadata
        run: uv lock --check
      - name: Upload exact dependency receipt
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error

  meta-framework:
    runs-on: ubuntu-latest
    name: DSPy meta-framework
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile meta-framework
        run: python -m compileall -q src/dspygen/meta tests/test_meta_framework.py
      - name: Run bounded meta-framework witnesses
        env:
          PYTHONPATH: src
        run: uv run --no-project --with pytest pytest tests/test_meta_framework.py -q

  powl-dspy:
    runs-on: ubuntu-latest
    name: dspy.Powl POWL 2.0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile POWL surfaces
        run: python -m compileall -q src/dspygen/powl tests/test_dspy_powl.py
      - name: Execute POWL algebra, bounded workflow, and real DSPy extension witnesses
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project --with pytest --with 'dspy==3.3.0'
          pytest tests/test_dspy_powl.py -q

  protocol-surfaces:
    runs-on: ubuntu-latest
    name: MCP and LSP
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run protocol tests with focused modern dependencies
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project
          --with pytest --with pytest-asyncio --with mcp --with pygls
          --with lsprotocol --with pydantic --with pyyaml --with loguru
          --with hypothesis --with rich --with chromadb --with typer
          pytest tests/test_mcp.py tests/test_lsp.py --tb=short -q

  errc-modernization:
    runs-on: ubuntu-latest
    name: ERRC modernization
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute modernization witnesses and falsifiers
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv run --no-project --with 'dspy==3.3.0' --with pydantic --with typer \
            python -m unittest discover -s tests -p 'test_*modernization*.py' -v
          uv run --no-project --with 'dspy==3.3.0' --with pydantic --with typer \
            python -m unittest discover -s tests -p 'test_*runtime*.py' -v
      - name: Independent whole-tree repository verifier
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-project --with 'dspy==3.3.0' --with pydantic --with typer
          python scripts/verify_modernization.py
          --root . --expected-legacy-placeholders 45
          --output /tmp/dspygen-modernization.json
      - uses: actions/upload-artifact@v4
        with:
          name: dspygen-modernization-receipt
          path: /tmp/dspygen-modernization.json
          if-no-files-found: error
