name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Ruff
        run: pip install "ruff==0.16.1"
      - name: Ruff check (non-mutating)
        run: ruff check --no-fix src/
      - name: Ruff format (advisory)
        run: ruff format --check src/ || echo "::warning::Some files would be reformatted. Run 'ruff format src/' locally to fix."
