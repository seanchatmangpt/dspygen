name: Ecosystem ALIVE Pack Lock

on:
  pull_request:
    paths:
      - "packs/cmd-*.json"
      - ".ggen/packs.lock"
      - "src/dspygen/architecture/cmd_repository.py"
      - ".github/workflows/ecosystem-alive-pack-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecosystem-alive-pack-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  manufacture-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Manufacture canonical pack digests and lock twice
        run: |
          cat > "$RUNNER_TEMP/manufacture_pack_lock.py" <<'PY'
          import json
          from pathlib import Path
          from dspygen.architecture.cmd_kernel import resolve_bblock
          from dspygen.architecture.cmd_repository import load_bblocks, load_packs, pack_content_digest, policy_digest
          from dspygen.architecture.digest import blake3_hex
          root = Path('.')
          for path in sorted((root / 'packs').glob('cmd-*.json')):
              document = json.loads(path.read_text())
              for item in document.get('packs', [document]):
                  item['content_digest'] = pack_content_digest(item)
              path.write_text(json.dumps(document, indent=2, sort_keys=True) + '\n')
          packs = load_packs(root)
          blocks = load_bblocks(root)
          lock_path = root / '.ggen/packs.lock'
          lock = json.loads(lock_path.read_text()) if lock_path.is_file() else {}
          lock['content_digests'] = {identity: pack.content_digest for identity, pack in sorted(packs.items())}
          lock['ontology_digest'] = blake3_hex((root / '.specify/cmd/repository.ttl').read_bytes())
          lock['policy_digest'] = policy_digest(root)
          if blocks:
              lock['resolved_atomic_pack_closure'] = list(resolve_bblock(blocks[0], packs)['closure'])
              lock['root_requests'] = [f'{blocks[0].identity}@{blocks[0].version}']
          lock_path.write_text(json.dumps(lock, indent=2, sort_keys=True) + '\n')
          PY
          python3 "$RUNNER_TEMP/manufacture_pack_lock.py"
          sha256sum packs/cmd-*.json .ggen/packs.lock > "$RUNNER_TEMP/first.sha256"
          python3 "$RUNNER_TEMP/manufacture_pack_lock.py"
          sha256sum packs/cmd-*.json .ggen/packs.lock > "$RUNNER_TEMP/second.sha256"
          diff -u "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"

      - name: Enforce ownership and record manufactured consequence
        id: consequence
        run: |
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = sorted(path for path in paths if path != '.ggen/packs.lock' and not path.startswith('packs/cmd-'))
          if unexpected:
              raise SystemExit(f'PACK_LOCK_PATH_ESCAPE_REFUSED: {unexpected}')
          PY
          if git diff --quiet -- packs/cmd-*.json .ggen/packs.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PACK_LOCK_ALREADY_CANONICAL"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "dspygen-alive-controller"
            git config user.email "dspygen-alive-controller@users.noreply.github.com"
            git add packs/cmd-*.json .ggen/packs.lock
            git commit -m "fix(cmd): rebuild exact pack lock"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute complete CMD verifier ladder on committed tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from dspygen.architecture.cmd_repository import verify_pack_lock
          failures = verify_pack_lock(Path('.'))
          if failures:
              raise SystemExit(f'PACK_LOCK_REPLAY_REFUSED: {failures}')
          PY
          python3 -m unittest discover -s tests/cmd -p 'test_*.py' -v
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Publish exact manufactured consequence
        if: steps.consequence.outputs.changed == 'true'
        run: git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
