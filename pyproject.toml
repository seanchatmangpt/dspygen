[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dspygen"
version = "2026.8.9"
description = "A meta-framework for DSPy programs: process inference, combinatorial optimization, bounded execution, and evidence receipts."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sean Chatman", email = "info@chatmangpt.com" }]
dependencies = [
  "anyio>=4.3",
  "apscheduler>=3.10.4",
  "asyncer>=0.0.7",
  "chromadb>=1.5.9",
  "clingo>=5.7.1",
  "coloredlogs>=15.0.1",
  "confz>=2.0.1",
  "docutils>=0.21",
  "dspy>=3.3.0",
  "duckduckgo-search>=8.1.1",
  "ebooklib>=0.18",
  "factory-boy>=3.3.0",
  "fastapi[all]>=0.137.0",
  "groq>=1.4.0",
  "gspread>=6.1.2",
  "gunicorn>=20.1.0; platform_system != 'Windows'",
  "html2text>=2024.2.26",
  "httpx>=0.28.1",
  "icalendar>=5.0.13",
  "icontract>=2.6.6",
  "ijson>=3.2.3",
  "inflection>=0.5.1",
  "inject>=5.2.1",
  "jinja2>=3.1.3",
  "jinja2-ext>=0.1",
  "jinja2-time>=0.2.0",
  "loguru>=0.7.3",
  "lsprotocol>=2024.0",
  "mcp>=1.0.0",
  "munch>=4.0.0",
  "numpy>=2.2.6",
  "ollama>=0.6.2",
  "openai>=2.41.1",
  "osascript>=2020.12.3; platform_system == 'Darwin'",
  "paho-mqtt>=2.0.0",
  "pandasql>=0.7.3",
  "pddlpy>=0.4.4",
  "playwright>=1.41.2",
  "pm4py>=2.7.11.11",
  "poethepoet>=0.20.0",
  "prefect>=3.7.4",
  "protobuf>=5.0",
  "psutil>=5.9.8",
  "py-trees>=2.2.3",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.1",
  "pygame>=2.5.2",
  "pygls>=2.0.0",
  "pykka>=4.0.2",
  "pyobjc>=10.3.1; platform_system == 'Darwin'",
  "pyobjc-framework-contacts>=10.3.1; platform_system == 'Darwin'",
  "pyobjc-framework-eventkit>=10.3.1; platform_system == 'Darwin'",
  "pyperclip>=1.8.2",
  "pypdf>=6.0.0",
  "python-docx>=1.1.0",
  "python-dotenv>=1.0.1",
  "python-pptx>=1.0.0",
  "pytz>=2025.1",
  "reactivex>=4.0.4",
  "realtime>=2.31.0",
  "rich>=13.0",
  "sentify>=0.7.4",
  "sqlmodel>=0.0.38",
  "st-pages>=0.4.5",
  "streamlit>=1.19.0",
  "sungen>=2024.9.28",
  "tpot>=0.12.2",
  "trafilatura>=2.1.0",
  "transitions>=0.9.0",
  "typer[all]>=0.26.7",
  "tzlocal>=5.2",
  "uvicorn[standard]>=0.20.0",
  "websockets>=15.0.1",
]

[project.urls]
Repository = "https://github.com/seanchatmangpt/dspygen"

[project.scripts]
dspygen = "dspygen.cli:app"
dspygen-mcp = "dspygen.mcp.server:run_stdio"
dspygen-lsp = "dspygen.lsp.server:run_stdio"
dspygen-jupyter = "dspygen.jupyter.kernel:load_ipython_extension"

[project.entry-points.pytest11]
dspygen = "dspygen.pytest_plugin"

[project.optional-dependencies]
llm = ["anthropic>=0.40", "cohere>=5.0", "mistralai>=1.0"]
retrieval = ["faiss-cpu>=1.8", "qdrant-client>=1.9", "pinecone>=5.0"]
jupyter = ["jupyter>=1.0", "jupyterlab>=4.0", "ipykernel>=6.0", "ipywidgets>=8.0", "nbformat>=5.9"]
docs = ["sphinx>=7.0", "myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx-autodoc-typehints>=1.25", "sphinxcontrib-mermaid>=0.9"]

[dependency-groups]
test = [
  "coverage[toml]>=7.2.5",
  "mypy>=1.2.0",
  "pre-commit>=3.3.1",
  "pytest>=9.1.0",
  "pytest-asyncio>=1.4.0",
  "pytest-clarity>=1.0.1",
  "pytest-httpx>=0.36.2",
  "pytest-mock>=3.10.0",
  "pytest-xdist>=3.2.1",
  "ruff>=0.2.1",
]
dev = ["cruft>=2.14.0", "jupyterlab>=4.0", "pdoc>=13.1.1"]

[tool.uv]
default-groups = ["test"]
resolution = "highest"
prerelease = "if-necessary-or-explicit"

[tool.hatch.build.targets.wheel]
packages = ["src/dspygen"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 30
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError", "if __name__"]

[tool.coverage.run]
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src/dspygen"]
omit = ["*/experiments/*", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
junit_xml = "reports/mypy.xml"
plugins = "pydantic.mypy"
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
exclude = ["experiments/", "tests/", "wip/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:warnings --tb=short -q -m 'not slow and not benchmark and not requires_openai and not requires_ollama'"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
xfail_strict = true
markers = [
  "slow: marks tests as slow",
  "integration: marks multi-component integration tests",
  "mcp: marks DSPyGen MCP tests",
  "lsp: marks DSPyGen LSP tests",
  "dspy_module: marks tests needing LM configuration",
  "requires_openai: marks tests needing OPENAI_API_KEY",
  "requires_ollama: marks tests needing Ollama",
  "property_based: marks hypothesis tests",
  "benchmark: marks performance benchmarks",
  "requires_llm: marks tests requiring a real LLM API key",
  "dspygen_requires_openai: skip when OPENAI_API_KEY is not set",
]

[tool.ruff]
fix = true
line-length = 100
src = ["src", "tests"]
target-version = "py311"
exclude = ["src/dspygen/experiments", "src/dspygen/wip", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "PLE", "PLC"]
ignore = [
  "E501", "E402", "B008", "N999", "N806", "N803", "N815", "N802", "N818",
  "F401", "F841", "F405", "F403", "F402", "F811", "F821", "PLC0415",
  "UP035", "UP031", "UP007", "B904", "B007", "B005", "B905", "E741", "W291", "W293",
]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "FBT", "F401"]
"src/dspygen/experiments/**" = ["ALL"]
"src/dspygen/wip/**" = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.poe.tasks]
lock = "uv lock --upgrade"
inst = "uv sync --all-groups"
pub = "uv build"
test = "uv run coverage run && uv run coverage report && uv run coverage xml"
lint = "uv run pre-commit run --all-files --color always"
